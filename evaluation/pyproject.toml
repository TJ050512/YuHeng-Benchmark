[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yuheng-eval"
version = "0.1.0"
description = "Reference evaluation code for the anonymous YuHeng benchmark submission"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
yuheng-eval = "yuheng_eval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
